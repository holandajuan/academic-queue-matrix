[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fila-academica"
version = "0.1.0"
description = "Bot Matrix para uma fila FIFO de atendimento acadêmico"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
fila-academica = "fila_academica.main:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
